<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI测试</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/docx/7.8.2/docx.umd.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f7f7f5;
    --surface: #ffffff;
    --surface2: #f0efea;
    --border: rgba(0,0,0,0.08);
    --border2: rgba(0,0,0,0.14);
    --text: #1a1a18;
    --text2: #5a5a55;
    --text3: #9a9a90;
    --accent: #2563eb;
    --accent-bg: #eff6ff;
    --font: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  }
  body { font-family: var(--font); background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  /* Header */
  .header { height: 52px; background: var(--surface); border-bottom: 0.5px solid var(--border2); display: flex; align-items: center; padding: 0 20px; gap: 12px; flex-shrink: 0; }
  .logo { font-size: 15px; font-weight: 600; color: var(--text); }
  .mode-tabs { display: flex; gap: 4px; margin-left: auto; }
  .mode-tab { padding: 5px 14px; border-radius: 6px; font-size: 12.5px; cursor: pointer; border: 0.5px solid transparent; color: var(--text2); background: transparent; font-family: var(--font); transition: all 0.15s; }
  .mode-tab.active { background: var(--accent-bg); color: var(--accent); border-color: #bfdbfe; }
  .mode-tab:hover:not(.active) { background: var(--surface2); }

  /* Layout */
  .layout { display: flex; flex: 1; overflow: hidden; }

  /* Sidebar */
  .sidebar { width: 200px; min-width: 200px; background: var(--surface); border-right: 0.5px solid var(--border); display: flex; flex-direction: column; padding: 14px 10px; gap: 3px; overflow-y: auto; }
  .sidebar-label { font-size: 10px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: 0.07em; padding: 8px 8px 5px; }
  .sidebar-btn { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 7px; font-size: 12.5px; color: var(--text2); cursor: pointer; border: none; background: transparent; font-family: var(--font); text-align: left; width: 100%; transition: background 0.12s; }
  .sidebar-btn:hover { background: var(--surface2); color: var(--text); }
  .sidebar-btn .icon { font-size: 15px; width: 18px; text-align: center; flex-shrink: 0; }
  .sidebar-btn.new-chat { color: var(--accent); font-weight: 500; }
  .history-item { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 7px; font-size: 12px; color: var(--text3); cursor: pointer; transition: background 0.12s; }
  .history-item:hover { background: var(--surface2); color: var(--text2); }

  /* Main area */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

  /* Chat view */
  #chat-view { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .chat-messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; scroll-behavior: smooth; }
  .chat-messages::-webkit-scrollbar { width: 4px; }
  .chat-messages::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }

  .msg-row { display: flex; gap: 10px; max-width: 800px; width: 100%; }
  .msg-row.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg-row.ai { align-self: flex-start; }
  .avatar { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; margin-top: 2px; }
  .avatar.user { background: var(--accent); color: white; font-weight: 600; font-size: 12px; }
  .avatar.ai { background: #f0fdf4; border: 0.5px solid #bbf7d0; font-size: 14px; }
  .bubble { padding: 10px 14px; font-size: 13.5px; line-height: 1.65; max-width: 680px; }
  .bubble.user { background: var(--accent); color: white; border-radius: 14px 14px 3px 14px; }
  .bubble.ai { background: var(--surface); border: 0.5px solid var(--border2); color: var(--text); border-radius: 3px 14px 14px 14px; white-space: pre-wrap; }
  .bubble.thinking { color: var(--text3); font-style: italic; background: var(--surface2); border: 0.5px solid var(--border); border-radius: 3px 14px 14px 14px; }
  .download-btn { display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; padding: 6px 14px; background: #f0fdf4; border: 0.5px solid #86efac; color: #166534; border-radius: 6px; font-size: 12.5px; cursor: pointer; font-family: var(--font); transition: background 0.15s; }
  .download-btn:hover { background: #dcfce7; }

  /* Input area */
  .input-wrap { padding: 12px 20px 16px; border-top: 0.5px solid var(--border); background: var(--surface); }
  .input-box { display: flex; gap: 8px; align-items: flex-end; background: var(--surface2); border: 0.5px solid var(--border2); border-radius: 12px; padding: 8px 10px 8px 14px; transition: border-color 0.15s; }
  .input-box:focus-within { border-color: var(--accent); }
  #msg-input { flex: 1; resize: none; background: transparent; border: none; outline: none; font-size: 13.5px; font-family: var(--font); color: var(--text); line-height: 1.5; max-height: 120px; height: 24px; }
  #msg-input::placeholder { color: var(--text3); }
  #send-btn { width: 32px; height: 32px; border-radius: 8px; background: var(--accent); border: none; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: opacity 0.15s; }
  #send-btn:hover { opacity: 0.85; }
  #send-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .input-hint { font-size: 11px; color: var(--text3); margin-top: 6px; text-align: center; }

  /* Doc view */
  #doc-view { flex: 1; display: none; flex-direction: column; overflow: hidden; }
  .doc-toolbar { padding: 12px 20px; border-bottom: 0.5px solid var(--border); background: var(--surface); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .doc-toolbar-label { font-size: 12.5px; color: var(--text2); }
  .upload-btn { padding: 6px 14px; border-radius: 6px; font-size: 12.5px; border: 0.5px solid var(--border2); background: var(--surface); color: var(--text); cursor: pointer; font-family: var(--font); transition: background 0.15s; }
  .upload-btn:hover { background: var(--surface2); }
  .doc-action-btn { padding: 6px 14px; border-radius: 6px; font-size: 12.5px; border: 0.5px solid #bfdbfe; background: var(--accent-bg); color: var(--accent); cursor: pointer; font-family: var(--font); transition: background 0.15s; }
  .doc-action-btn:hover { background: #dbeafe; }
  .doc-action-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  #doc-input { display: none; }
  .doc-body { flex: 1; display: flex; overflow: hidden; }
  .doc-panel { flex: 1; overflow-y: auto; padding: 24px 28px; }
  .doc-panel:first-child { border-right: 0.5px solid var(--border); }
  .doc-panel-title { font-size: 11px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 14px; }
  #original-content, #edited-content { font-size: 13.5px; line-height: 1.8; color: var(--text); white-space: pre-wrap; min-height: 200px; }
  .doc-placeholder { color: var(--text3); font-size: 13px; }
  .doc-prompt-row { padding: 12px 20px; border-top: 0.5px solid var(--border); background: var(--surface); display: flex; gap: 8px; }
  #doc-prompt { flex: 1; padding: 8px 12px; border: 0.5px solid var(--border2); border-radius: 8px; font-size: 13px; font-family: var(--font); color: var(--text); background: var(--surface2); outline: none; }
  #doc-prompt:focus { border-color: var(--accent); }
  #doc-send-btn { padding: 0 16px; border-radius: 8px; background: var(--accent); border: none; color: white; font-size: 13px; font-family: var(--font); cursor: pointer; height: 36px; transition: opacity 0.15s; }
  #doc-send-btn:hover { opacity: 0.85; }
  #doc-send-btn:disabled { opacity: 0.35; cursor: not-allowed; }

  /* Welcome screen */
  .welcome { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: var(--text3); }
  .welcome-title { font-size: 20px; font-weight: 500; color: var(--text2); }
  .welcome-sub { font-size: 13px; }
  .welcome-chips { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 12px; }
  .welcome-chip { padding: 7px 14px; border-radius: 20px; border: 0.5px solid var(--border2); font-size: 12.5px; color: var(--text2); cursor: pointer; background: var(--surface); transition: background 0.15s; }
  .welcome-chip:hover { background: var(--surface2); }

  @media (max-width: 600px) {
    .sidebar { display: none; }
    .doc-body { flex-direction: column; }
    .doc-panel:first-child { border-right: none; border-bottom: 0.5px solid var(--border); }
  }
</style>
</head>
<body>

<div class="header">
  <div class="logo">🤖 AI测试</div>
  <div class="mode-tabs">
    <button class="mode-tab active" onclick="switchMode('chat')" id="tab-chat">💬 对话</button>
    <button class="mode-tab" onclick="switchMode('doc')" id="tab-doc">📄 文档处理</button>
  </div>
</div>

<div class="layout">
  <div class="sidebar">
    <button class="sidebar-btn new-chat" onclick="newChat()">
      <span class="icon">✏️</span> 新建对话
    </button>
    <div class="sidebar-label">历史记录</div>
    <div id="history-list">
      <div class="history-item">暂无历史记录</div>
    </div>
  </div>

  <div class="main">

    <!-- 对话模式 -->
    <div id="chat-view">
      <div class="chat-messages" id="chat-messages">
        <div class="welcome" id="welcome-screen">
          <div style="font-size:36px">🤖</div>
          <div class="welcome-title">你好，我是 AI测试</div>
          <div class="welcome-sub">有什么可以帮到你的？</div>
          <div class="welcome-chips">
            <div class="welcome-chip" onclick="fillChat('帮我写一封商务邮件')">✉️ 写商务邮件</div>
            <div class="welcome-chip" onclick="fillChat('帮我分析这段文字的逻辑')">🔍 文字分析</div>
            <div class="welcome-chip" onclick="fillChat('帮我翻译成英文：')">🌐 中英翻译</div>
            <div class="welcome-chip" onclick="fillChat('帮我写一份工作总结')">📝 写工作总结</div>
          </div>
        </div>
      </div>

      <div class="input-wrap">
        <div class="input-box">
          <textarea id="msg-input" placeholder="输入你的问题…" onkeydown="handleKey(event)" oninput="resizeInput(this)"></textarea>
          <button id="send-btn" onclick="sendChat()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
          </button>
        </div>
        <div class="input-hint">按 Enter 发送，Shift+Enter 换行</div>
      </div>
    </div>

    <!-- 文档处理模式 -->
    <div id="doc-view">
      <div class="doc-toolbar">
        <span class="doc-toolbar-label">上传文档：</span>
        <button class="upload-btn" onclick="document.getElementById('doc-input').click()">📂 选择 Word 文件</button>
        <input type="file" id="doc-input" accept=".docx,.txt" onchange="loadDoc(event)">
        <span id="doc-filename" style="font-size:12px;color:var(--text3)"></span>
        <button class="doc-action-btn" id="dl-btn" style="margin-left:auto;display:none" onclick="downloadWord()">⬇️ 下载修改后的 Word</button>
      </div>

      <div class="doc-body">
        <div class="doc-panel">
          <div class="doc-panel-title">原始文档</div>
          <div id="original-content"><span class="doc-placeholder">上传 Word 文件后，内容将显示在这里…</span></div>
        </div>
        <div class="doc-panel">
          <div class="doc-panel-title">AI 修改后</div>
          <div id="edited-content"><span class="doc-placeholder">AI 处理完成后，修改结果将显示在这里…</span></div>
        </div>
      </div>

      <div class="doc-prompt-row">
        <input type="text" id="doc-prompt" placeholder="告诉 AI 怎么修改，例如：帮我润色语言，使其更正式专业…" />
        <button id="doc-send-btn" onclick="processDoc()">处理文档</button>
      </div>
    </div>

  </div>
</div>

<script>
let chatHistory = [];
let docText = '';
let editedText = '';
let currentMode = 'chat';

function switchMode(mode) {
  currentMode = mode;
  document.getElementById('chat-view').style.display = mode === 'chat' ? 'flex' : 'none';
  document.getElementById('doc-view').style.display = mode === 'doc' ? 'flex' : 'none';
  document.getElementById('tab-chat').classList.toggle('active', mode === 'chat');
  document.getElementById('tab-doc').classList.toggle('active', mode === 'doc');
}

function newChat() {
  chatHistory = [];
  const msgs = document.getElementById('chat-messages');
  msgs.innerHTML = `
    <div class="welcome" id="welcome-screen">
      <div style="font-size:36px">🤖</div>
      <div class="welcome-title">你好，我是 AI测试</div>
      <div class="welcome-sub">有什么可以帮到你的？</div>
      <div class="welcome-chips">
        <div class="welcome-chip" onclick="fillChat('帮我写一封商务邮件')">✉️ 写商务邮件</div>
        <div class="welcome-chip" onclick="fillChat('帮我分析这段文字的逻辑')">🔍 文字分析</div>
        <div class="welcome-chip" onclick="fillChat('帮我翻译成英文：')">🌐 中英翻译</div>
        <div class="welcome-chip" onclick="fillChat('帮我写一份工作总结')">📝 写工作总结</div>
      </div>
    </div>`;
}

function fillChat(text) {
  const input = document.getElementById('msg-input');
  input.value = text;
  resizeInput(input);
  input.focus();
}

function resizeInput(el) {
  el.style.height = '24px';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); }
}

function appendMsg(role, text, withDownload) {
  const welcome = document.getElementById('welcome-screen');
  if (welcome) welcome.remove();

  const msgs = document.getElementById('chat-messages');
  const row = document.createElement('div');
  row.className = 'msg-row ' + role;

  const avatar = document.createElement('div');
  avatar.className = 'avatar ' + role;
  avatar.textContent = role === 'user' ? '我' : '🤖';

  const bubble = document.createElement('div');
  bubble.className = 'bubble ' + (role === 'user' ? 'user' : 'ai');
  bubble.textContent = text;

  if (withDownload && editedText) {
    const btn = document.createElement('div');
    btn.innerHTML = '<br><button class="download-btn" onclick="downloadFromChat()">⬇️ 下载 Word 文件</button>';
    bubble.appendChild(btn);
  }

  row.appendChild(avatar);
  row.appendChild(bubble);
  msgs.appendChild(row);
  msgs.scrollTop = msgs.scrollHeight;
  return bubble;
}

async function sendChat() {
  const input = document.getElementById('msg-input');
  const btn = document.getElementById('send-btn');
  const text = input.value.trim();
  if (!text || btn.disabled) return;

  input.value = ''; resizeInput(input); btn.disabled = true;
  appendMsg('user', text);
  chatHistory.push({ role: 'user', content: text });

  const thinking = appendMsg('ai', '正在思考中…');
  thinking.classList.add('thinking');

  try {
    const resp = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        messages: chatHistory,
        systemPrompt: '你是一个专业高效的AI助理，用中文回复，回答简洁清晰，可直接使用。'
      })
    });
    const data = await resp.json();
    const reply = data.content || data.error || '请求失败，请重试';
    thinking.classList.remove('thinking');
    thinking.className = 'bubble ai';
    thinking.textContent = reply;
    chatHistory.push({ role: 'assistant', content: reply });
  } catch (err) {
    thinking.classList.remove('thinking');
    thinking.className = 'bubble ai';
    thinking.textContent = '连接失败，请稍后重试。';
  }

  btn.disabled = false;
  document.getElementById('chat-messages').scrollTop = 99999;
}

// 文档处理
async function loadDoc(e) {
  const file = e.target.files[0];
  if (!file) return;
  document.getElementById('doc-filename').textContent = file.name;

  if (file.name.endsWith('.txt')) {
    const text = await file.text();
    docText = text;
    document.getElementById('original-content').textContent = text;
  } else {
    const arrayBuffer = await file.arrayBuffer();
    const result = await mammoth.extractRawText({ arrayBuffer });
    docText = result.value;
    document.getElementById('original-content').textContent = docText;
  }

  document.getElementById('edited-content').innerHTML = '<span class="doc-placeholder">输入修改指令，点击「处理文档」</span>';
}

async function processDoc() {
  if (!docText) { alert('请先上传文档'); return; }
  const prompt = document.getElementById('doc-prompt').value.trim();
  if (!prompt) { alert('请输入修改指令'); return; }

  const btn = document.getElementById('doc-send-btn');
  btn.disabled = true;
  btn.textContent = '处理中…';
  document.getElementById('edited-content').innerHTML = '<span class="doc-placeholder">AI 正在处理，请稍候…</span>';

  try {
    const resp = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        messages: [{ role: 'user', content: `以下是原文档内容：\n\n${docText}\n\n请按照以下要求修改：${prompt}\n\n直接输出修改后的完整内容，不要加任何解释。` }],
        systemPrompt: '你是专业的文档编辑助理，严格按照用户指令修改文档，直接输出修改结果，不添加多余说明。'
      })
    });
    const data = await resp.json();
    editedText = data.content || '';
    document.getElementById('edited-content').textContent = editedText;
    document.getElementById('dl-btn').style.display = 'inline-flex';
  } catch (err) {
    document.getElementById('edited-content').textContent = '处理失败，请重试。';
  }

  btn.disabled = false;
  btn.textContent = '处理文档';
}

async function downloadWord() {
  if (!editedText) return;
  generateAndDownload(editedText, '修改后文档.docx');
}

async function downloadFromChat() {
  if (!editedText) return;
  generateAndDownload(editedText, '修改后文档.docx');
}

async function generateAndDownload(text, filename) {
  const { Document, Paragraph, TextRun, Packer } = docx;
  const paragraphs = text.split('\n').map(line =>
    new Paragraph({ children: [new TextRun({ text: line, size: 24, font: 'Microsoft YaHei' })] })
  );
  const doc = new Document({ sections: [{ properties: {}, children: paragraphs }] });
  const blob = await Packer.toBlob(doc);
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

switchMode('chat');
</script>
</body>
</html>
